name: Build Android APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip project-clean.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm install

      - name: Fix Vite Config for Capacitor
        run: |
          node -e "
            const fs = require('fs');
            let v = fs.readFileSync('vite.config.ts', 'utf8');
            
            // 1. Добавляем base: './' для относительных путей
            if (!v.includes('base:')) {
              v = v.replace('export default defineConfig({', \"export default defineConfig({\n  base: './',\");
            }
            
            // 2. Включаем SPA режим для TanStack Start, чтобы создавался index.html
            if (v.includes('tanstackStart({')) {
               v = v.replace('tanstackStart({', 'tanstackStart({ spa: { enabled: true, prerender: { crawlLinks: true, outputPath: \"index.html\" } }, ');
            }
            fs.writeFileSync('vite.config.ts', v);
          "

      - name: Build Web Assets
        run: npm run build

      - name: Prepare dist for Capacitor
        run: |
          # Принудительно указываем Capacitor искать в папке dist
          echo '{"appId":"com.example.app","appName":"Force-bizness","webDir":"dist"}' > capacitor.config.json
          
          mkdir -p dist
          # Ищем, куда Vite сложил файлы, и копируем их в dist
          if [ -d ".vercel/output/static" ]; then
            cp -r .vercel/output/static/* dist/
          elif [ -d "dist/client" ]; then
            cp -r dist/client/* dist/
          fi
          
          # Если index.html нет, но есть _shell.html - переименовываем
          if [ ! -f "dist/index.html" ] && [ -f "dist/_shell.html" ]; then
            mv dist/_shell.html dist/index.html
          fi

      - name: Add and Sync Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kryazh-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
