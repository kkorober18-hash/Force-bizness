name: Build Android APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip project-clean.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm install

      # --- АВТОМАТИЧЕСКОЕ ИСПРАВЛЕНИЕ НАСТРОЕК ---
      - name: Fix Capacitor and Vite Configs
        run: |
          # Принудительно указываем папку dist для Capacitor
          echo '{"appId":"com.example.app","appName":"Force-bizness","webDir":"dist"}' > capacitor.config.json
          
          # Включаем SPA режим для TanStack Start (создаем временный файл конфигурации)
          node -e "
            const fs = require('fs');
            let v = fs.readFileSync('vite.config.ts', 'utf8');
            if (!v.includes('spa: {')) {
              v = v.replace('tanstackStart({', 'tanstackStart({ spa: { enabled: true },');
            }
            fs.writeFileSync('vite.config.ts', v);
          "
      # -------------------------------------------

      - name: Build Web Assets
        run: npm run build:web

      - name: Add and Sync Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kryazh-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
