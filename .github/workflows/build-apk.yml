name: Build Android APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip project-clean.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Prepare dist for Capacitor
        run: |
          # 1. Принудительно указываем Capacitor искать в папке dist
          echo '{"appId":"com.example.app","appName":"Force-bizness","webDir":"dist"}' > capacitor.config.json
          
          # 2. Копируем собранные клиентские файлы в dist
          if [ -d "dist/client" ]; then
            cp -r dist/client/* dist/
          fi
          
          # 3. Находим файл оболочки и переименовываем его в index.html
          SHELL_FILE=$(find dist -name "_shell.html" -o -name "index.html" | head -n 1)
          if [ -n "$SHELL_FILE" ]; then
            cp "$SHELL_FILE" dist/index.html
          else
            echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>App</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi

      - name: Add and Sync Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kryazh-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
